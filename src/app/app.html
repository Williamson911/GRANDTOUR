<div class="shell">
  <header class="topbar">
    <a class="brand" routerLink="/map">
      <img
        class="brand__logo"
        src="images/grand_tour_logo.svg"
        alt="Grand Tour"
      />
      <span class="brand__sub">{{ i18n.t('header.subtitle') }}</span>
    </a>
    <nav class="nav" aria-label="Navigation">
      @if (session(); as s) {
        @for (item of nav; track item.path) {
          <a
            class="nav__link"
            [routerLink]="item.path"
            routerLinkActive="nav__link--active"
          >
            {{ i18n.t(item.labelKey) }}
          </a>
        }
      } @else {
        <a
          class="nav__link"
          routerLink="/login"
          routerLinkActive="nav__link--active"
        >
          {{ i18n.t('nav.login') }}
        </a>
        <a
          class="nav__link"
          routerLink="/register"
          routerLinkActive="nav__link--active"
        >
          {{ i18n.t('nav.register') }}
        </a>
      }

      <div class="lang" role="group" aria-label="Language">
        <button
          type="button"
          class="lang__btn"
          [class.lang__btn--active]="lang() === 'fr'"
          (click)="setLang('fr')"
        >
          FR
        </button>
        <button
          type="button"
          class="lang__btn"
          [class.lang__btn--active]="lang() === 'en'"
          (click)="setLang('en')"
        >
          EN
        </button>
      </div>

      @if (session(); as s) {
        <a
          class="nav__user"
          routerLink="/profile"
          routerLinkActive="nav__user--active"
          [title]="i18n.t('nav.profileTooltip')"
        >
          {{ i18n.t('nav.greeting') }} <strong>{{ s.username }}</strong>
        </a>
        <button type="button" class="nav__logout" (click)="logout()">
          {{ i18n.t('nav.logout') }}
        </button>
      }
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
