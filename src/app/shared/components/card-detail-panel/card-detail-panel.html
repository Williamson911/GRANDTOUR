<div class="detail-panel">
  <button type="button" class="detail-panel__close" (click)="close()">×</button>

  @if (imgUrl(); as img) {
    <img [src]="img" [alt]="displayName()" class="detail-panel__thumb" />
  }
  <h3 class="detail-panel__name">{{ displayName() }}</h3>
  <p class="detail-panel__meta">{{ printing().cardNumber }} · {{ printing().rarity }}</p>

  <form [formGroup]="form" (ngSubmit)="add()">
    <label>
      <span>{{ i18n.t('cardDetail.quantity') }}</span>
      <input type="number" formControlName="quantity" min="1" />
    </label>
    <label>
      <span>{{ i18n.t('cardDetail.price') }}</span>
      <input type="number" formControlName="price" min="0" step="0.01" />
    </label>

    <div class="detail-panel__actions">
      <button type="submit" class="btn btn--accent">{{ i18n.t('cardDetail.add') }}</button>
      @if (isExisting()) {
        <button type="button" class="btn btn--ghost-danger" (click)="remove()">
          {{ i18n.t('cardDetail.remove') }}
        </button>
      }
    </div>
  </form>
</div>
