<section class="server-down" [attr.data-lang]="lang()">
  <div class="server-down__card">
    <div class="server-down__icon" aria-hidden="true">
      <svg viewBox="0 0 32 32">
        <path
          d="M16 3 L29 28 L3 28 Z"
          fill="none"
          stroke="var(--color-accent)"
          stroke-width="2.5"
          stroke-linejoin="round"
        />
        <line
          x1="16" y1="13" x2="16" y2="20"
          stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round"
        />
        <circle cx="16" cy="24" r="1.6" fill="var(--color-accent)" />
      </svg>
    </div>
    <h1>{{ i18n.t('serverDown.title') }}</h1>
    <p>{{ i18n.t('serverDown.body') }}</p>
    <pre class="server-down__cmd"><code>npm run db</code></pre>
    <button
      type="button"
      class="server-down__cta"
      (click)="retry()"
      [disabled]="online() === null"
    >
      {{ i18n.t('serverDown.cta') }}
    </button>
  </div>
</section>
