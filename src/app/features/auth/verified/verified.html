<section class="auth" [attr.data-lang]="lang()">
  <div class="auth__card auth__card--success">
    <div class="auth__check" aria-hidden="true">✓</div>
    <h1 class="auth__title">
      @if (username()) {
        {{ i18n.t('verified.titleWithName', { username: username() }) }}
      } @else {
        {{ i18n.t('verified.title') }}
      }
    </h1>
    <p class="auth__subtitle">{{ i18n.t('verified.body') }}</p>
    <button type="button" class="auth__submit" (click)="continue()">
      {{ i18n.t('verified.cta') }}
    </button>
  </div>
</section>
