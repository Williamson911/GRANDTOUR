<section class="auth" [attr.data-lang]="lang()">
  @if (linkSent()) {
    <div class="auth__card auth__card--success">
      <div class="auth__check" aria-hidden="true">✉</div>
      <h1 class="auth__title">{{ i18n.t('forgot.linkSent.title') }}</h1>
      <p class="auth__subtitle">{{ i18n.t('forgot.linkSent.body') }}</p>
      <a class="auth__submit" routerLink="/login">
        {{ i18n.t('forgot.backToLogin') }}
      </a>
    </div>
  } @else {
    <form
      class="auth__card"
      [formGroup]="form"
      (ngSubmit)="submit()"
      autocomplete="on"
      novalidate
    >
      <h1 class="auth__title">{{ i18n.t('forgot.title') }}</h1>
      <p class="auth__subtitle">{{ i18n.t('forgot.subtitle') }}</p>

      <label class="auth__field">
        <span>{{ i18n.t('forgot.email') }}</span>
        <input
          type="email"
          name="email"
          formControlName="email"
          autocomplete="email"
          required
        />
        @if (form.get('email'); as ctrl) {
          @if (ctrl.touched && ctrl.errors?.['required']) {
            <small class="auth__field-error">
              {{ i18n.t('forgot.errors.emailRequired') }}
            </small>
          } @else if (ctrl.touched && ctrl.errors?.['email']) {
            <small class="auth__field-error">
              {{ i18n.t('forgot.errors.emailInvalid') }}
            </small>
          }
        }
      </label>

      <button type="submit" class="auth__submit" [disabled]="busy()">
        @if (busy()) {
          {{ i18n.t('forgot.busy') }}
        } @else {
          {{ i18n.t('forgot.submit') }}
        }
      </button>

      <p class="auth__switch">
        <a routerLink="/login">{{ i18n.t('forgot.backToLogin') }}</a>
      </p>
    </form>
  }
</section>
